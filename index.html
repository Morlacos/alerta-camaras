<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0f1115">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Alerta Cámaras LA</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<style>
:root{--bg:#0f1115;--card:#1a1d24;--line:#2a2e38;--tx:#eef0f4;--mut:#9aa1ad;--ok:#2fbf71;--warn:#f5a524;--bad:#ef4444;--acc:#3b82f6}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.4 -apple-system,system-ui,Segoe UI,Roboto,sans-serif}
body{padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom)}
header{padding:14px 16px 6px;display:flex;align-items:center;justify-content:space-between}
h1{font-size:18px;margin:0}
.pill{font-size:12px;padding:4px 10px;border-radius:99px;background:var(--card);border:1px solid var(--line);color:var(--mut)}
.pill.on{color:var(--ok);border-color:var(--ok)}
main{padding:0 16px 24px;max-width:640px;margin:0 auto}
.hero{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:18px;margin-top:8px;transition:background .3s,border-color .3s}
.hero.alert{background:#3a1212;border-color:var(--bad)}
.hero.near{background:#3a2a0e;border-color:var(--warn)}
.lbl{font-size:13px;color:var(--mut)}
.dist{font-size:52px;font-weight:700;letter-spacing:-1px;margin:2px 0}
.street{font-size:19px;font-weight:600}
.seg{font-size:14px;color:var(--mut)}
.row{display:flex;gap:10px;margin-top:14px}
.box{flex:1;background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:10px;text-align:center}
.box b{display:block;font-size:26px}
.box.over b{color:var(--bad)}
.sign{display:inline-flex;flex-direction:column;align-items:center;background:#fff;color:#000;border:3px solid #000;border-radius:6px;padding:2px 8px;line-height:1}
.sign small{font-size:9px;font-weight:700}.sign b{font-size:24px}
button{font:inherit;border:0;border-radius:14px;padding:16px;width:100%;font-weight:700;font-size:18px;cursor:pointer}
#go{background:var(--acc);color:#fff;margin-top:14px}
#go.stop{background:#374151}
.opts{display:flex;gap:8px;margin-top:12px;flex-wrap:wrap}
.opts label{font-size:14px;color:var(--mut);display:flex;align-items:center;gap:6px}
select{font:inherit;background:var(--card);color:var(--tx);border:1px solid var(--line);border-radius:10px;padding:8px}
#map{height:300px;border-radius:16px;margin-top:14px;border:1px solid var(--line)}
h2{font-size:15px;margin:20px 0 8px;color:var(--mut);font-weight:600}
ul{list-style:none;margin:0;padding:0}
li{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 12px;margin-bottom:8px;display:flex;justify-content:space-between;gap:10px;align-items:center}
li .s{font-weight:600}li .m{font-size:13px;color:var(--mut)}
.d{font-weight:700;white-space:nowrap}
.tag{font-size:11px;padding:2px 7px;border-radius:99px;margin-left:6px;vertical-align:middle}
.tag.live{background:#163b26;color:var(--ok)}.tag.build{background:#2b2f39;color:var(--mut)}.tag.unk{background:#2b2f39;color:var(--mut)}
#msg{font-size:14px;color:var(--warn);margin-top:10px;min-height:1em}
input[type=search]{width:100%;font:inherit;padding:12px;border-radius:12px;border:1px solid var(--line);background:var(--card);color:var(--tx)}
footer{font-size:12px;color:var(--mut);margin-top:20px;line-height:1.5}
a{color:#7fb0ff}
.hdr-r{display:flex;gap:8px;align-items:center}
#lang{padding:4px 8px;font-size:13px;border-radius:99px}
footer p{margin:0 0 6px}
</style>
</head>

<header><h1 data-i="title"></h1><div class="hdr-r"><select id="lang" aria-label="Idioma / Language"><option value="es">🌐 ES</option><option value="en">🌐 EN</option></select><span id="st" class="pill"></span></div></header>
<main>
  <div id="hero" class="hero">
    <div class="lbl" data-i="nearest"></div>
    <div class="dist" id="dist">—</div>
    <div class="street" id="street"></div>
    <div class="seg" id="seg"></div>
    <div class="row">
      <div class="box" id="spdbox"><span class="lbl" data-i="yourSpeed"></span><b id="spd">—</b><span class="lbl">mph</span></div>
      <div class="box"><span class="lbl" data-i="camLimit"></span><div style="margin-top:4px"><span class="sign"><small>SPEED<br>LIMIT</small><b id="lim">—</b></span></div></div>
    </div>
    <button id="go"></button>
    <div id="msg"></div>
    <div class="opts">
      <label><span data-i="warnAt"></span> <select id="rad"><option value="250" data-i="r250"></option><option value="400" selected data-i="r400"></option><option value="800" data-i="r800"></option></select></label>
      <label><span data-i="voice"></span> <select id="voice"><option value="1" selected data-i="yes"></option><option value="0" data-i="no"></option></select></label>
    </div>
  </div>

  <div id="map"></div>

  <h2 data-i="nearList"></h2>
  <ul id="near"><li><span class="m" data-i="nearEmpty"></span></li></ul>

  <h2 data-i="allList"></h2>
  <input type="search" id="q">
  <ul id="all" style="margin-top:8px"></ul>

  <footer><p data-i="foot1"></p><p data-i="foot2"></p><p data-i="foot3"></p></footer>
</main>

function hav(a,b,c,d){const R=6371000,r=Math.PI/180,x=(c-a)*r,y=(d-b)*r;
  const h=Math.sin(x/2)**2+Math.cos(a*r)*Math.cos(c*r)*Math.sin(y/2)**2;return 2*R*Math.asin(Math.sqrt(h));}
function fmt(m){const mi=m/1609.34; return mi<0.1? Math.round(m*3.281)+' ft' : mi.toFixed(mi<10?1:0)+' mi';}
function fmtSay(m){const mi=m/1609.34; return mi<0.1? Math.round(m*3.281)+' '+t('feet') : mi.toFixed(1)+' '+t('miles');}
function esc(s){return String(s).replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));}
function label(c){return esc(c.st);}
function seg(c){return t('between',{a:esc(c.a),b:esc(c.b)});}
function stat(c){return t(c.s);}

// ---------- map ----------
try{
  map=L.map('map',{zoomControl:false}).setView([34.08,-118.38],10);
  L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:19,attribution:'© OpenStreetMap'}).addTo(map);
  CAMS.forEach(c=>{
    const col=c.s==='live'?'#2fbf71':'#f5a524';
    markers.push([c, L.circleMarker([c.lat,c.lng],{radius:6,color:'#000',weight:1,fillColor:col,fillOpacity:.95}).addTo(map)]);
  });
}catch(e){$('map').style.display='none';}
function bindPopups(){ markers.forEach(([c,m])=>m.bindPopup(`<b>${label(c)}</b><br>${seg(c)}<br>${t('limit')} ${c.mph} mph · ${stat(c)}`)); }

// ---------- full list ----------
function renderAll(q){
  q=(q==null?$('q').value:q).trim().toLowerCase();
  const rows=CAMS.filter(c=>!q||(c.st+' '+c.a+' '+c.b).toLowerCase().includes(q))
    .sort((x,y)=>x.st.localeCompare(y.st));
  $('all').innerHTML=rows.map(c=>`<li data-id="${c.id}"><div><div class="s">${label(c)}<span class="tag ${c.s}">${stat(c)}</span></div><div class="m">${seg(c)} · ${t('district')} ${c.cd}</div></div><div class="d">${c.mph} mph${me?'<br><span class="m">'+fmt(hav(me.lat,me.lng,c.lat,c.lng))+'</span>':''}</div></li>`).join('')||`<li><span class="m">${t('none')}</span></li>`;
}
$('q').addEventListener('input',e=>renderAll(e.target.value));
$('all').addEventListener('click',e=>{const li=e.target.closest('li[data-id]');if(!li||!map)return;
  const c=CAMS.find(x=>x.id===li.dataset.id);map.setView([c.lat,c.lng],16);$('map').scrollIntoView({behavior:'smooth'});});

// ---------- language ----------
function setRunUI(on){
  $('go').textContent=t(on?'stop':'start'); $('go').classList.toggle('stop',on);
  $('st').textContent=t(on?'on':'off'); $('st').classList.toggle('on',on);
}
function applyLang(){
  document.documentElement.lang=LANG;
  $('lang').value=LANG;
  document.querySelectorAll('[data-i]').forEach(el=>{el.textContent=t(el.dataset.i);});
  $('q').placeholder=t('search');
  document.title=t('title').replace('📷 ','');
  setRunUI(watchId!=null);
  if(lastP) render(lastP); else { $('street').textContent=t('pressStart'); $('seg').textContent=t('loaded'); }
  if(map) bindPopups();
  renderAll();
}
$('lang').addEventListener('change',e=>{
  LANG=e.target.value; try{localStorage.setItem('lang',LANG);}catch(_){}
  $('msg').textContent='';
  applyLang();
  if(NATIVE&&watchId!=null) nativeStart();
});

// ---------- alerts ----------
function beep(n=2){try{audioCtx=audioCtx||new (window.AudioContext||window.webkitAudioContext)();
  for(let i=0;i<n;i++){const o=audioCtx.createOscillator(),g=audioCtx.createGain();o.type='square';o.frequency.value=880;
    g.gain.value=.15;o.connect(g);g.connect(audioCtx.destination);const s=audioCtx.currentTime+i*.28;o.start(s);o.stop(s+.18);} }catch(e){}}
function say(text){if($('voice').value!=='1'||!('speechSynthesis' in window))return;
  try{speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(text);u.lang=t('speech');u.rate=1.05;speechSynthesis.speak(u);}catch(e){}}
function vib(p){try{navigator.vibrate&&navigator.vibrate(p);}catch(e){}}

let lastMph=null, lastAcc=0;
function render(ds){
  const R=+$('rad').value, n=ds[0], mph=lastMph;
  $('spd').textContent=mph==null?'—':Math.round(mph);
  $('msg').textContent=lastAcc>100?t('lowAcc',{n:Math.round(lastAcc)}):($('msg').textContent);
  $('dist').textContent=fmt(n.d);
  $('street').textContent=n.c.st;
  $('seg').textContent=t('between',{a:n.c.a,b:n.c.b})+' · '+stat(n.c);
  $('lim').textContent=n.c.mph;
  $('spdbox').classList.toggle('over', mph!=null && mph>n.c.mph && n.d<R);
  const hero=$('hero'); hero.classList.remove('alert','near');
  if(n.d<R*0.5) hero.classList.add('alert'); else if(n.d<R) hero.classList.add('near');
  $('near').innerHTML=ds.slice(0,6).map(({c,d})=>`<li><div><div class="s">${label(c)}<span class="tag ${c.s}">${stat(c)}</span></div><div class="m">${seg(c)}</div></div><div class="d">${fmt(d)}<br><span class="m">${c.mph} mph</span></div></li>`).join('');
}

function onPos(p){
  const {latitude:lat,longitude:lng,speed,accuracy}=p.coords;
  const prev=me; me={lat,lng,t:p.timestamp};
  let mph=null;
  if(speed!=null&&!isNaN(speed)&&speed>=0) mph=speed*2.23694;
  else if(prev&&p.timestamp>prev.t){mph=hav(prev.lat,prev.lng,lat,lng)/((p.timestamp-prev.t)/1000)*2.23694;}
  lastMph=mph; lastAcc=accuracy;
  if(accuracy<=100 && $('msg').textContent.startsWith(t('lowAcc',{n:''}).split('(')[0])) $('msg').textContent='';

  const R=+$('rad').value;
  const ds=CAMS.map(c=>({c,d:hav(lat,lng,c.lat,c.lng)})).sort((a,b)=>a.d-b.d);
  lastP=ds;
  render(ds);
  const n=ds[0];
  const over = mph!=null && mph>n.c.mph+10 && n.d<R;

  // alert logic: once on entering radius, again at 40% of radius; reset when far away
  ds.forEach(({c,d})=>{ if(d>R*1.6 && alerted.get(c.id)) alerted.delete(c.id); });
  for(const {c,d} of (NATIVE?[]:ds.slice(0,5))){
    const lvl=alerted.get(c.id);
    if(d<R && !lvl){alerted.set(c.id,'near');beep(2);vib([200,100,200]);
      say(t('sayNear',{d:fmtSay(d),st:c.st,mph:c.mph}));}
    else if(d<R*0.4 && lvl==='near'){alerted.set(c.id,'alert');beep(3);vib([400,100,400]);
      say(over?t('saySlow',{mph:c.mph}):t('sayAhead',{mph:c.mph}));}
  }

  if(map){const ll=[lat,lng];
    if(!meMarker){meMarker=L.circleMarker(ll,{radius:9,color:'#fff',weight:3,fillColor:'#3b82f6',fillOpacity:1}).addTo(map);map.setView(ll,14);}
    else{meMarker.setLatLng(ll);if(!map.getBounds().pad(-0.2).contains(ll))map.panTo(ll);}
  }
}
function onErr(e){
  const m={1:t('denied'),2:t('noPos'),3:t('timeout')};
  $('msg').textContent=m[e.code]||e.message;
}
async function keepAwake(){try{if('wakeLock' in navigator){wakeLock=await navigator.wakeLock.request('screen');}}catch(e){}}
document.addEventListener('visibilitychange',()=>{if(watchId!=null&&document.visibilityState==='visible')keepAwake();});

function startWatch(){
  watchId=navigator.geolocation.watchPosition(onPos,onErr,{enableHighAccuracy:true,maximumAge:2000,timeout:15000});
  setRunUI(true);
}
$('go').addEventListener('click',()=>{
  if(watchId!=null){navigator.geolocation.clearWatch(watchId);watchId=null;try{wakeLock&&wakeLock.release();}catch(e){}
    if(NATIVE){try{window.Android.stop();}catch(e){}}
    setRunUI(false);return;}
  if(NATIVE){
    if(!nativeStart()){$('msg').textContent=t('needPerm');return;}
    $('msg').textContent=t('nativeOn');
    startWatch();return;
  }
  if(!('geolocation' in navigator)){$('msg').textContent=t('noGps');return;}
  if(location.protocol==='file:'){$('msg').textContent=t('fileWarn');}
  beep(1); say(t('sayOn')); keepAwake();
  startWatch();
});
['rad','voice'].forEach(id=>$(id).addEventListener('change',()=>{if(NATIVE&&watchId!=null)nativeStart();}));

applyLang();
if(NATIVE){try{if(window.Android.isRunning())startWatch();}catch(e){}}
</script>
